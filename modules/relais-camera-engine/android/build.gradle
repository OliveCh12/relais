apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.relaiscameraengine'
version = '0.1.0'

dependencies {
  implementation 'com.facebook.fbjni:fbjni:0.7.0'
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-vision-camera')
  implementation project(':react-native-nitro-modules')
  implementation project(':react-native-webrtc')
  implementation 'androidx.camera:camera-camera2:1.7.0-alpha03'
  implementation 'androidx.camera:camera-lifecycle:1.7.0-alpha03'
  implementation 'androidx.camera:camera-video:1.7.0-alpha03'
}

android {
  ndkVersion rootProject.ext.ndkVersion
  namespace 'expo.modules.relaiscameraengine'
  defaultConfig {
    ndk { abiFilters.addAll((findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',')) }
    versionCode 1
    versionName '0.1.0'
    externalNativeBuild {
      cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
    }
  }
  buildFeatures { prefab true }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
  packagingOptions {
    jniLibs.excludes += ['**/libc++_shared.so', '**/libNitroModules.so', '**/libVisionCamera.so', '**/libfbjni.so', '**/libjsi.so', '**/libreactnative.so']
  }
  sourceSets.main.assets.srcDirs += ['../fixtures']
}
